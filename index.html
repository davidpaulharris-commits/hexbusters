<html lang="en-GB">
<head>
<meta charset="utf-8">

<title>Wreckers of Porthcove</title>
<meta name="description" content="A hidden-role party game for one room and many phones.">
<meta name="theme-color" content="#0b1619">
<meta property="og:title" content="Wreckers of Porthcove">
<meta property="og:description" content="You've been invited to a game. Tap to join the table.">

<style>
/* Layout: one phone-width column; each phase is one "scene" card; fixed bottom tab rail. Single night-sea theme lit by lantern amber. */
:root{
  color-scheme: dark;
  --sea:#0b1619; --hull:#122328; --plank:#182e34; --rope:#28444b; --rope-2:#385b63;
  --foam:#efe7d4; --mist:#b0bdba; --dim:#7a8f90;
  --lamp:#f5b041; --lamp-2:#ffd685; --lamp-ink:#2b1a03;
  --wreck:#ec6b52; --true:#7fcbb2; --gold:#ebc86d;
  --l-red:#e0533f; --l-green:#3fb071; --l-white:#f2ecdc; --l-amber:#f2a531;
  --f-display:"IM Fell English SC","Iowan Old Style",Georgia,serif;
  --f-ital:"IM Fell English","Iowan Old Style",Georgia,serif;
  --f-body:"Alegreya Sans","Segoe UI",Roboto,system-ui,sans-serif;
  --r:14px;
}
html,body{height:100%}
body{background:radial-gradient(130% 55% at 50% -8%,rgba(245,176,65,.13),transparent 62%),var(--sea);background-attachment:fixed;color:var(--foam);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sea)}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 120px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(2.3rem,9vw,3.2rem);line-height:1}
h2{font-size:1.65rem;line-height:1.1}
h3{font-size:1.25rem}
p{margin:0}
.eyebrow{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.lede{color:var(--mist);font-size:1.05rem;max-width:60ch}
.ital{font-family:var(--f-ital);font-style:italic}
.muted{color:var(--mist)} .dim{color:var(--dim)}
.small{font-size:.88rem}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.spread{justify-content:space-between}
.card{background:var(--hull);border:1px solid var(--rope);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.card.lit{border-color:color-mix(in oklab,var(--lamp) 55%,var(--rope));box-shadow:0 0 0 1px rgba(245,176,65,.08),0 10px 40px -18px rgba(245,176,65,.45)}
.card.blood{border-color:color-mix(in oklab,var(--wreck) 60%,var(--rope))}
.btn{appearance:none;border:1px solid var(--rope-2);background:var(--plank);border-radius:12px;padding:12px 16px;font-weight:700;font-size:1rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;text-align:center}
.btn:focus-visible,.pick:focus-visible,.tab:focus-visible,.chipbtn:focus-visible,.lampbtn:focus-visible{outline:2px solid var(--lamp-2);outline-offset:2px}
.btn.lamp{background:var(--lamp);color:var(--lamp-ink);border-color:var(--lamp)}
.btn.lamp:active{background:var(--lamp-2)}
.btn.wreck{background:transparent;border-color:var(--wreck);color:var(--wreck)}
.btn.quiet{background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:38px;padding:7px 12px;font-size:.9rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=text],input[type=number],textarea{width:100%;box-sizing:border-box;background:var(--sea);border:1px solid var(--rope-2);border-radius:10px;color:var(--foam);font:inherit;padding:12px}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--lamp);outline-offset:1px}
label.lab{font-weight:700;font-size:.9rem;color:var(--mist)}
/* hero */
.hero{position:relative;display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:end;padding-top:10px}
.hero h1 span{display:block;color:var(--lamp)}
.hero .lede{grid-column:1/-1}
.lighthouse{width:86px;height:120px;position:relative}
.beam{position:absolute;left:43px;top:22px;width:260px;height:60px;transform-origin:0 50%;background:linear-gradient(90deg,rgba(255,214,133,.55),rgba(255,214,133,0));clip-path:polygon(0 45%,100% 0,100% 100%,0 55%);animation:sweep 6s ease-in-out infinite;pointer-events:none;filter:blur(1px)}
@keyframes sweep{0%{transform:rotate(-200deg);opacity:0}15%{opacity:.9}50%{transform:rotate(-160deg);opacity:.9}85%{opacity:0}100%{transform:rotate(-120deg);opacity:0}}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in oklab,var(--sea) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rope)}
.bar-in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:10px}
.bar .title{font-family:var(--f-display);font-size:1.15rem;line-height:1.05;min-width:0;flex:1}
.bar .title small{display:block;font-family:var(--f-body);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700}
.hoard{display:flex;align-items:center;gap:6px;color:var(--gold);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.iconbtn{appearance:none;background:transparent;border:1px solid var(--rope);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;color:var(--mist)}
.ico{width:20px;height:20px;flex:none}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--hull);border-top:1px solid var(--rope);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{appearance:none;background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.78rem;font-weight:700;color:var(--dim);cursor:pointer;position:relative}
.tab.on{color:var(--lamp)}
.tab .dot{position:absolute;top:7px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--wreck)}
/* crew */
.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.mate{background:var(--plank);border:1px solid var(--rope);border-radius:12px;padding:10px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;position:relative;min-width:0}
.mate .nm{font-weight:800;font-size:.92rem;line-height:1.1;overflow-wrap:anywhere}
.mate .tr{font-size:.74rem;color:var(--dim);line-height:1.1}
.mate.out{opacity:.55}
.mate.out .portrait{filter:grayscale(1)}
.mate .kick{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:8px;border:1px solid var(--rope);background:var(--hull);color:var(--mist);cursor:pointer;font-size:.9rem;line-height:1}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:99px;border:1px solid var(--rope-2);color:var(--mist)}
.tag.w{color:var(--wreck);border-color:var(--wreck)}
.tag.v{color:var(--true);border-color:var(--true)}
.tag.lamp{color:var(--lamp);border-color:var(--lamp)}
.tag.ok{color:var(--true);border-color:color-mix(in oklab,var(--true) 60%,var(--rope))}
.portrait{display:block;border-radius:50%}
/* picks */
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.pick{appearance:none;background:var(--plank);border:2px solid var(--rope);border-radius:12px;padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;font-weight:800;font-size:.9rem;min-width:0;overflow-wrap:anywhere}
.pick.on{border-color:var(--lamp);background:color-mix(in oklab,var(--lamp) 14%,var(--plank))}
.pick.target.on{border-color:var(--wreck);background:color-mix(in oklab,var(--wreck) 16%,var(--plank))}
/* secret card */
.secret{position:relative;border-radius:16px;border:1px dashed var(--rope-2);background:repeating-linear-gradient(135deg,var(--plank) 0 12px,var(--hull) 12px 24px);min-height:190px;display:grid;place-items:center;text-align:center;padding:18px;user-select:none;-webkit-user-select:none;touch-action:none;cursor:pointer}
.secret .closed{display:flex;flex-direction:column;align-items:center;gap:10px}
.secret .open{display:none;flex-direction:column;align-items:center;gap:8px}
.secret.open{border-style:solid;background:var(--hull)}
.secret.open .closed{display:none}
.secret.open .open{display:flex}
.secret.open.isw{border-color:var(--wreck)}
.secret.open.isv{border-color:var(--true)}
.rolename{font-family:var(--f-display);font-size:2.3rem;line-height:1}
.rolename.w{color:var(--wreck)} .rolename.v{color:var(--true)}
.seal{width:64px;height:64px}
/* timer */
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:2.6rem;line-height:1;color:var(--lamp);letter-spacing:.02em}
.timer.small{font-size:1.1rem}
.meter{height:6px;background:var(--plank);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--lamp);width:100%;transform-origin:left;transition:transform .25s linear}
/* scenes */
.scene-head{display:flex;flex-direction:column;gap:6px}
.big-news{font-family:var(--f-ital);font-size:1.35rem;line-height:1.35}
.host{border:1px solid color-mix(in oklab,var(--lamp) 40%,var(--rope));background:color-mix(in oklab,var(--lamp) 6%,var(--hull));border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.host .eyebrow{color:var(--lamp)}
.opts{display:grid;gap:8px}
.opt{appearance:none;text-align:left;background:var(--plank);border:2px solid var(--rope);border-radius:12px;padding:13px 14px;font-weight:700;cursor:pointer;display:flex;gap:10px;align-items:center}
.opt .k{font-family:var(--f-display);color:var(--lamp);font-size:1.2rem;width:1.2em}
.opt.on{border-color:var(--lamp)}
.opt.right{border-color:var(--true);background:color-mix(in oklab,var(--true) 14%,var(--plank))}
.opt.wrong{opacity:.55}
.lamps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lampbtn{appearance:none;aspect-ratio:1;max-width:100%;border-radius:50%;border:3px solid var(--rope-2);background:var(--plank);cursor:pointer;display:grid;place-items:center;font-weight:800;font-size:.78rem;color:var(--sea);position:relative}
.lampbtn[data-c="0"]{--c:var(--l-red)} .lampbtn[data-c="1"]{--c:var(--l-green)} .lampbtn[data-c="2"]{--c:var(--l-white)} .lampbtn[data-c="3"]{--c:var(--l-amber)}
.lampbtn{background:color-mix(in oklab,var(--c) 28%,var(--plank));color:var(--foam)}
.lampbtn.lit,.lampbtn:active{background:var(--c);color:var(--sea);box-shadow:0 0 28px 4px color-mix(in oklab,var(--c) 70%,transparent);border-color:var(--c)}
.seqdots{display:flex;gap:6px;min-height:18px;flex-wrap:wrap}
.seqdots i{width:16px;height:16px;border-radius:50%;display:block}
canvas.cargo{width:100%;height:auto;aspect-ratio:16/11;border-radius:12px;background:#0d2228;border:1px solid var(--rope)}
.tally{display:flex;flex-direction:column;gap:8px}
.tally .t{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.tally .bar2{height:10px;border-radius:99px;background:var(--plank);overflow:hidden}
.tally .bar2 i{display:block;height:100%;background:var(--wreck)}
.votes{display:flex;flex-direction:column;gap:6px}
.vote-line{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--plank);border-radius:10px;animation:rise .45s ease both}
.vote-line .arrow{color:var(--dim)}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.reveal-role{font-family:var(--f-display);font-size:clamp(2.4rem,11vw,3.4rem);line-height:1;animation:rise .8s ease both}
.notes{display:flex;flex-direction:column;gap:10px}
.note{background:var(--plank);border:1px solid var(--rope);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.note .tx{white-space:pre-wrap;overflow-wrap:anywhere}
.log{display:flex;flex-direction:column;gap:2px}
.logline{display:grid;grid-template-columns:3.4em 1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid var(--rope);align-items:start}
.logline .tide{font-family:var(--f-display);color:var(--lamp);font-size:.95rem}
.logline .tx{overflow-wrap:anywhere;min-width:0}
.logline .bells{display:block;color:var(--dim);font-size:.76rem}
.ev{border-left:3px solid var(--lamp);padding:8px 12px;background:var(--plank);border-radius:0 10px 10px 0}
.ev .by{font-size:.8rem;color:var(--dim);font-weight:700}
.banner{background:color-mix(in oklab,var(--wreck) 18%,var(--hull));border:1px solid var(--wreck);border-radius:12px;padding:10px 12px;font-weight:700}
.banner.info{background:var(--plank);border-color:var(--rope-2);font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:8;max-width:min(520px,calc(100% - 32px));background:var(--lamp);color:var(--lamp-ink);border-radius:12px;padding:12px 14px;font-weight:700;box-shadow:0 14px 40px -12px rgba(0,0,0,.7);display:flex;gap:10px;align-items:center}
.toast button{margin-left:auto;background:var(--lamp-ink);color:var(--lamp);border:0;border-radius:8px;padding:6px 10px;font-weight:800;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{appearance:none;border:1px solid var(--rope-2);background:var(--plank);border-radius:99px;padding:8px 12px;font-weight:700;font-size:.88rem;cursor:pointer}
.chipbtn.on{background:var(--lamp);color:var(--lamp-ink);border-color:var(--lamp)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{appearance:none;width:38px;height:38px;border-radius:50%;border:3px solid var(--rope);cursor:pointer}
.sw.on{border-color:var(--lamp-2)}
.preview{display:flex;gap:14px;align-items:center}
.setting{display:flex;flex-direction:column;gap:6px}
details.rules{background:var(--hull);border:1px solid var(--rope);border-radius:var(--r);padding:4px 16px}
details.rules summary{cursor:pointer;padding:12px 0;font-family:var(--f-display);font-size:1.25rem;list-style:none}
details.rules summary::-webkit-details-marker{display:none}
details.rules[open] summary{border-bottom:1px solid var(--rope);margin-bottom:10px}
.rulelist{display:flex;flex-direction:column;gap:10px;padding-bottom:14px;color:var(--mist)}
.rulelist b{color:var(--foam)}
.term{color:var(--lamp);font-weight:800}
.game-li{display:flex;align-items:center;gap:12px;background:var(--plank);border:1px solid var(--rope);border-radius:12px;padding:12px;cursor:pointer;text-align:left;width:100%;appearance:none}
.game-li .cd{font-family:var(--f-display);font-size:1.4rem;color:var(--lamp);letter-spacing:.08em}
.game-li .meta{flex:1;min-width:0}
.invite{display:grid;grid-template-columns:minmax(0,132px) 1fr;gap:14px;align-items:center}
.qr{background:#fff;border-radius:12px;padding:8px;line-height:0}
.qr svg{width:100%;height:auto;display:block}
.linktext{overflow-wrap:anywhere;user-select:all;-webkit-user-select:all;margin:0}
code{font-family:ui-monospace,monospace;font-size:.9em;color:var(--lamp-2)}
.code{font-family:var(--f-display);font-size:2.8rem;letter-spacing:.18em;color:var(--lamp);line-height:1}
.scoreboard{display:flex;flex-direction:column;gap:6px}
.scoreboard .s{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.pause{position:fixed;inset:0;z-index:9;background:rgba(5,10,12,.82);display:grid;place-items:center;text-align:center;padding:24px}
.flash{animation:flash 1.2s ease}
@keyframes flash{0%{background:color-mix(in oklab,var(--lamp) 35%,var(--hull))}100%{background:var(--hull)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.beam{opacity:.5;transform:rotate(-160deg)}}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
</style>

<script>
"use strict";
/* ============================================================
   Wreckers of Porthcove — host-authoritative party game.
   Host phone runs the rules and writes public state to db `games/<CODE>`.
   Players send actions through their presence in room `wc-<code>`;
   secrets (roles, picks) are sealed with ECDH + AES-GCM.
   ============================================================ */
const app=document.getElementById('app');
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rint=n=>Math.floor(Math.random()*n);
const pick=a=>a&&a.length?a[rint(a.length)]:undefined;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rint(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const clone=o=>JSON.parse(JSON.stringify(o));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clampInt=(v,a,b)=>{v=Math.round(Number(v));return isFinite(v)?Math.max(a,Math.min(b,v)):a};
function rid(n=8){const a='abcdefghjkmnpqrstuvwxyz23456789';let s='';const b=new Uint8Array(n);(window.crypto||{}).getRandomValues?crypto.getRandomValues(b):b.forEach((_,i)=>b[i]=rint(256));for(const x of b)s+=a[x%a.length];return s}
function gameCode(){const a='BCDFGHJKLMNPQRSTVWXZ';let s='';for(let i=0;i<4;i++)s+=a[rint(a.length)];return s}

/* ---------------- Content ---------------- */
const TRADES=[['Fisher','Knows every current in the bay.'],['Net-mender','Notices every loose thread.'],['Innkeeper','Hears every whisper at the Drowned Anchor.'],['Baker','Up before dawn; sees who comes home late.'],['Lighthouse Keeper','Watches the cliffs all night.'],['Blacksmith','Strong arm, short temper.'],['Parson','Hears confessions and keeps them.'],['Harbourmaster','Logs every boat in and out.'],['Shipwright','Can spot a holed hull at a glance.'],['Tin Miner','Used to working in the dark.'],['Postmistress','Reads the outside of every letter.'],['Pilchard Packer','Can smell trouble a mile off.'],['Lifeboat Cox','First into any storm.'],['Schoolteacher','Can spot a fib from the back row.']];
const SKINS=['#f5d6bd','#e7b38e','#c88b5f','#97623f','#663f27'];
const COATS=['#2f5d73','#8a3131','#3f6b45','#5b4a7a','#8f6c2c','#2b2f36','#a05b3a','#4b8390'];
const HATS=['Bare head','Sou’wester','Tricorn','Knit cap','Bonnet','Top hat','Bandana'];
const EXTRAS=['Nothing','Eyepatch','Spectacles','Beard','Pipe','Earring'];
const BOT_NAMES=['Old Tom','Morwenna','Jago','Demelza','Kitto','Tamsin','Pascoe','Lowena','Bran','Elowen','Jory','Kerensa'];
const BOT_QUIPS=['Never trust a calm sea.','I was at the pub all night, ask anyone.','Pass the pasties.','I only fish on Tuesdays.','Them lights weren’t mine.','Bless your boots.'];
const LAMP_NAMES=['Red','Green','White','Amber'];

const TRIVIA=[
['How many legs does a spider have?',['6','8','10','12'],1],

const CR={
 ok:!!(window.crypto&&crypto.subtle&&window.isSecureContext!==false),
 b64(buf){let s='';const b=new Uint8Array(buf);for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s)},
 unb64(s){const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u},
 async gen(){const kp=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey']);const j=await crypto.subtle.exportKey('jwk',kp.privateKey);return{jwk:{x:j.x,y:j.y,d:j.d},pub:{x:j.x,y:j.y}}},
 priv(j){return crypto.subtle.importKey('jwk',{kty:'EC',crv:'P-256',x:j.x,y:j.y,d:j.d,ext:true},{name:'ECDH',namedCurve:'P-256'},false,['deriveKey'])},
 async derive(privKey,pub){const pk=await crypto.subtle.importKey('jwk',{kty:'EC',crv:'P-256',x:pub.x,y:pub.y,ext:true},{name:'ECDH',namedCurve:'P-256'},false,[]);return crypto.subtle.deriveKey({name:'ECDH',public:pk},privKey,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])},
 async enc(key,obj){const data=new TextEncoder().encode(JSON.stringify(obj));if(!key)return{p:CR.b64(data)};const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,data);return{iv:CR.b64(iv),ct:CR.b64(ct)}},
 async dec(key,box){if(box.p)return JSON.parse(new TextDecoder().decode(CR.unb64(box.p)));if(!key)throw new Error('nokey');const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:CR.unb64(box.iv)},key,CR.unb64(box.ct));return JSON.parse(new TextDecoder().decode(pt))},
};

/* ---------------- Backend: Supabase for shared play, in-memory for practice ---------------- */
let BE=null;
function makeBackend(){
 const cfg=window.WRECKERS_CONFIG||{};
 const ok=window.supabase&&cfg.supabaseUrl&&cfg.supabaseAnonKey&&!/YOUR[-_]/i.test(cfg.supabaseUrl+cfg.supabaseAnonKey);
 return ok?supabaseBackend(cfg):localBackend();
}
function supabaseBackend(cfg){
 const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false},realtime:{params:{eventsPerSecond:20}}});
 const call=async(fn,args)=>{const {data,error}=await sb.rpc(fn,args);if(error)throw error;return data};
 return{local:false,
  load:code=>call('wreckers_get',{p_code:code}),
  create:(code,key,state)=>call('wreckers_create',{p_code:code,p_key:key,p_state:state}),
  save:async(code,key,state)=>{const ok=await call('wreckers_save',{p_code:code,p_key:key,p_state:state});if(!ok)throw{code:'not the host'};return ok},
  room:code=>supabaseRoom(sb,code)};
}
function supabaseRoom(sb,code){
 const ch=sb.channel('wreckers-'+code.toLowerCase(),{config:{presence:{key:S.pid},broadcast:{self:false,ack:false}}});
 const peerFns=[],stateFns=[];let prev={},mineP=null,joined=false;
 const list=()=>{const st=ch.presenceState(),out=[];for(const k in st){const metas=st[k]||[];const pr=Object.assign({},metas[metas.length-1]||{});delete pr.presence_ref;out.push({peer:k,by:null,isMe:k===S.pid,kind:'viewer',presence:pr})}return out};
 ch.on('presence',{event:'sync'},()=>{const ps=list(),j=[],u=[],now={};for(const p of ps){const s=JSON.stringify(p.presence);now[p.peer]=s;if(!(p.peer in prev))j.push(p);else if(prev[p.peer]!==s)u.push(p)}const left=Object.keys(prev).filter(k=>!(k in now)).map(k=>({peer:k}));prev=now;peerFns.forEach(f=>f({peers:ps,joined:j,updated:u,left}))});
 ch.on('broadcast',{event:'state'},m=>{const s=m&&m.payload&&m.payload.s;if(s)stateFns.forEach(f=>f(s))});
 ch.subscribe(status=>{
  if(status==='SUBSCRIBED'){joined=true;if(S.roomErr){S.roomErr=false;render()}if(mineP)ch.track(mineP).catch(()=>{});S.onRoomUp&&S.onRoomUp()}
  else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){joined=false;S.roomErr=true;render()}
  else if(status==='CLOSED'){joined=false}
 });
 return{
  presence:async obj=>{mineP=obj;if(joined)await ch.track(obj)},
  onPeers:f=>{peerFns.push(f)},
  onState:f=>{stateFns.push(f)},
  peers:()=>list(),
  sendState:s=>{if(joined)ch.send({type:'broadcast',event:'state',payload:{s}}).catch(()=>{})},
  leave:()=>{try{sb.removeChannel(ch)}catch(e){}},
  connected:()=>joined,
 };
}
function localBackend(){
 const rows=new Map();
 return{local:true,
  load:async code=>rows.has(code)?clone(rows.get(code).state):null,
  create:async(code,key,state)=>{if(rows.has(code))return false;rows.set(code,{key,state:clone(state)});return true},
  save:async(code,key,state)=>{const r=rows.get(code);if(!r||r.key!==key)throw{code:'not the host'};r.state=clone(state);return true},
  room:()=>({presence:async()=>{},onPeers(){},onState(){},peers:()=>[],sendState(){},leave(){},connected:()=>false})};
}

async function boot(){
 render();
 S.pid=LS.get('wc-pid',null);if(!S.pid){S.pid='p_'+rid(14);LS.set('wc-pid',S.pid)}
 try{BE=makeBackend()}catch(e){BE=localBackend()}
 S.practice=BE.local;
 await initKeys();
 S.ready=true;
 const link=linkCode();
 if(link&&!S.practice){if(!S.profile){S.pendingJoin=link;S.cdraft=null;S.view='create'}else openGame(link)}
 else{const cur=LS.get('wc-current',null);if(cur&&!S.practice)openGame(cur)}
 render();
}
function linkCode(){try{const c=(new URLSearchParams(location.search).get('g')||'').toUpperCase().replace(/[^A-Z]/g,'');return c.length===4?c:null}catch(e){return null}}
function joinLink(code){return location.origin+location.pathname+'?g='+code}
function setUrl(code){try{const u=code?joinLink(code):location.origin+location.pathname;if(location.href!==u)history.replaceState(null,'',u)}catch(e){}}
async function initKeys(){
 if(!CR.ok)return;
 const mk=async k=>({jwk:k.jwk,pub:k.pub,priv:await CR.priv(k.jwk)});
 try{let k=LS.get('wc-keys',null);if(!k||!k.jwk){k=await CR.gen();LS.set('wc-keys',k)}S.keys=await mk(k)}
 catch(e){try{const k=await CR.gen();LS.set('wc-keys',k);S.keys=await mk(k)}catch(e2){S.keys=null}}
}

/* ---------------- Player: joining & syncing ---------------- */
async function openGame(code){
 code=String(code).toUpperCase();
 S.code=code;LS.set('wc-current',code);LS.set('wc-last',code);S.view='game';S.tab='play';S.game=null;S.secret=null;S.secretSig=null;S.myActs={};S.lastBox=null;S.pendingEv=[];S.err=null;S.lastPres=null;
 S.notes=LS.get('wc-notes-'+code,[]);
 setUrl(code);render();
 let st;

const living=()=>{const g=H.g;return g.order.filter(p=>g.players[p]&&g.players[p].status==='alive')};

  case 'mission':{const m=g.mission;if(!m||m.stage!=='play'||m.type==='parlour')return[];return m.type==='boat'?living():g.order.slice()}

}

const nm=pid=>(H.g.players[pid]||{}).name||'Someone';
function nightTargets(){const L=living();return H.p.nightMode==='plunder'?L:L.filter(p=>!isW(p))}
function validInput(pid,d){
 const g=H.g,L=living();
 switch(g.phase){
  case 'gathering':return{ready:true};
  case 'night':{const w=(L.includes(d.whisper)&&d.whisper!==pid)?d.whisper:null;if(!w&&L.length>1)return null;const o={whisper:w};if(isW(pid)){if(!nightTargets().includes(d.target))return null;o.target=d.target}return o}
  case 'morning':return{accept:!!d.accept};

   if(m.type==='trivia'){const a=d.a|0;if(a<0||a>3)return null;return{a,t:clampInt(d.t,0,60000)}}
   if(m.type==='lamps'){if(!Array.isArray(d.seq))return null;return{seq:d.seq.slice(0,12).map(x=>x|0),t:clampInt(d.t,0,60000)}}

   return null}

}

   if(!g.players[p]||!g.players[p].bot||g.submitted.includes(p))continue;
   const delay=(g.phase==='mission'?1500:1200)+rint(4500);
   setTimeout(()=>{if(H.g&&H.g.phaseKey===k){const c=botChoice(p);if(c)hostInput(p,k,c)}},delay);
  }

function botChoice(p){
 const g=H.g,L=living().filter(x=>x!==p);
 switch(g.phase){
  case 'gathering':return{ready:true};
  case 'night':{const o={whisper:pick(L)};if(isW(p)){const t=nightTargets().filter(x=>x!==p);o.target=pick(t.length?t:nightTargets())}return o}
  case 'morning':return{accept:Math.random()<.5};
  case 'mission':{const m=g.mission;
   if(m.type==='trivia')return{a:Math.random()<.6?TRIVIA[m.q][2]:rint(4),t:2500+rint(12000)};
   if(m.type==='lamps')return{seq:Math.random()<.65?m.seq.slice():m.seq.map(()=>rint(4)),t:3000+rint(9000)};
   if(m.type==='cargo')return{n:Math.round(m.count*(.7+Math.random()*.6))};

   return null}

 switch(g.phase){

  case 'morning':if(g.morning.stage==='dawn'&&now>=g.morning.minAt&&(!H.p.recruitTarget||allIn()||now>=g.endsAt))resolveDawn();break;
  case 'mission':missionTick(now);break;

function missionRound(){

 if(m.type==='trivia'){const c=TRIVIA[m.q][2];let right=0;for(const p in inp){if(inp[p].a===c){right++;add(p,1,inp[p].t)}}gold=10*right;m.reveal={correct:c,right,total};g.endsAt=now+4500}
 if(m.type==='lamps'){let right=0;for(const p in inp){const ok=inp[p].seq.length===m.seq.length&&inp[p].seq.every((x,i)=>x===m.seq[i]);if(ok){right++;add(p,1,inp[p].t)}}gold=8*right;m.reveal={seq:m.seq,right,total};g.endsAt=now+4500}
 if(m.type==='cargo'){let close=0,best=null;for(const p in inp){const err=Math.abs(inp[p].n-m.count)/m.count;if(err<=.15){close++;add(p,1,0)}H.p.mtime[p]=(H.p.mtime[p]||0)+err;if(!best||err<best.err)best={p,err}}if(best)add(best.p,1,0);gold=10*close;m.reveal={count:m.count,close,total};g.endsAt=now+5000}

function gameView(){
 const g=G();
 if(S.hostLost)return `<div class="wrap"><div class="card blood"><h2>Host notes missing</h2><p class="muted">This phone started game ${esc(S.code)}, but its secret notes (who the Wreckers are) were cleared, so it can't carry on fairly.</p><button class="btn wreck block" data-act="close-lost">Forget that game</button><button class="btn quiet block" data-act="leave">Back to the harbour</button></div></div>`;
 if(!g)return `<div class="wrap"><div class="card"><p class="muted">${esc(S.err||'Rowing out to the game…')}</p><button class="btn quiet" data-act="leave">Back to the harbour</button></div></div>`;
 const tide=g.tide?`Tide ${g.tide} · ${PH[g.phase]||''}`:PH[g.phase]||'';
 const top=`<div class="bar"><div class="bar-in"><div class="title"><small>Game ${esc(g.code)}</small>${esc(tide)}</div><span class="hoard" title="The hoard">${IC.coin}${g.hoard||0}<span class="small dim">gns</span></span><button class="iconbtn" data-act="sound" aria-label="${S.sound?'Turn sound off':'Turn sound on'}">${S.sound?IC.sound:IC.mute}</button></div></div>`;
 let body='';
 if(S.tab==='notes')body=notesView();else if(S.tab==='log')body=logView();else if(S.tab==='crew')body=crewView();else body=playView();
 const alerts=[];
 if(!amHost()&&!S.hostSeen&&g.phase!=='finale'&&S.room)alerts.push(`<div class="banner">The host’s screen seems to be asleep. The game will carry on when it wakes.</div>`);
 if(S.writeErr&&amHost())alerts.push(`<div class="banner">Couldn’t save the game (${esc(S.writeErr)}). Check your connection; it will keep trying.</div>`);
 if(S.roomErr&&!S.practice)alerts.push(`<div class="banner">Lost touch with the game room. Reconnecting… If this stays, check your signal or reload the page.</div>`);
 const paused=g.paused?`<div class="pause"><div class="stack" style="align-items:center"><h2>Paused</h2><p class="muted">The host has stopped the clock.</p>${amHost()?`<button class="btn lamp" data-act="h-pause">Resume</button>`:''}</div></div>`:'';
 const tabs=`<nav class="tabs" aria-label="Game"><div class="tabs-in">${[['play','Play',IC.play],['notes','Notes',IC.notes],['log','Log',IC.log],['crew','Crew',IC.crew]].map(([k,l,i])=>`<button class="tab ${S.tab===k?'on':''}" data-act="tab" data-v="${k}" aria-current="${S.tab===k?'page':'false'}">${i}${l}${k==='log'&&S.newEv?'<span class="dot"></span>':''}</button>`).join('')}</div></nav>`;
 return `${top}<div class="wrap">${alerts.join('')}${body}</div>${tabs}${paused}`;
}
function spectating(){const g=G();return g.phase!=='lobby'&&!me()}
function playView(){
 const g=G();
 if(g.phase==='lobby')return lobbyView(g);
 if(spectating()&&!amHost())return `<div class="card"><h2>The game has begun</h2><p class="muted">This crew set sail before you joined. You can watch the log, or wait for the next game.</p></div>${logView()}`;
 switch(g.phase){
  case 'gathering':return gatheringView(g);
  case 'night':return nightView(g);
  case 'morning':return morningView(g);
  case 'mission':return missionView(g);
  case 'council':return councilView(g);
  case 'vote':return voteView(g);
  case 'reveal':return revealView(g);
  case 'banish':return banishView(g);
  case 'lastlight':return lastLightView(g);
  case 'finale':return finaleView(g);
  case 'closed':return `<div class="card"><h2>Game closed</h2><button class="btn" data-act="leave">Back to the harbour</button></div>`;
 }
 return '';
}

function nightView(g){

 <div class="card"><span class="eyebrow">Whisper a suspicion</span><p class="small muted">Who do you think is a Wrecker? The village hears the top whispers at dawn (not who whispered).</p>${pickList(others,wsel,'night-w')}</div>

/* ---------------- Live UI: countdowns, lamps, cargo ---------------- */
function tickUI(){
 const now=Date.now();
 document.querySelectorAll('[data-ends]').forEach(el=>{el.textContent=mmss(+el.dataset.ends-now)});
 document.querySelectorAll('[data-meter]').forEach(el=>{const d=+el.dataset.dur,r=Math.max(0,+el.dataset.meter-now);el.style.transform=`scaleX(${d?Math.min(1,r/d):0})`});
 const L=document.getElementById('lamps');
 if(L&&L.dataset.show){const t0=+L.dataset.show,st=+L.dataset.step,seq=L.dataset.seq;const k=Math.floor((now-t0)/st),on=k>=0&&k<seq.length&&((now-t0)%st)<st*.72;[0,1,2,3].forEach(i=>{const b=document.getElementById('lamp'+i);if(b)b.classList.toggle('lit',on&&+seq[k]===i)})}
 const C=document.getElementById('cargo');
 if(C)drawCargo(C,now);
}
setInterval(tickUI,120);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function drawCargo(c,now){
 const x=c.getContext('2d'),W=c.width,Hh=c.height,show=c.dataset.show,rv=c.dataset.reveal;
 const vis=rv||(show&&now>=+show&&now<+show+4000);
 const state=vis?'on':(show&&now<+show)?'wait':'off';
 if(c._state===state&&state!=='wait')return;c._state=state;
 x.fillStyle='#0d2228';x.fillRect(0,0,W,Hh);
 x.fillStyle='#c9b48a';x.beginPath();x.moveTo(0,Hh*.55);for(let i=0;i<=8;i++)x.quadraticCurveTo(W*(i+.5)/8,Hh*(.5+(i%2?.04:-.03)),W*(i+1)/8,Hh*.55);x.lineTo(W,Hh);x.lineTo(0,Hh);x.fill();
 if(state==='wait'){x.fillStyle='#efe7d4';x.font='700 34px Alegreya Sans, sans-serif';x.textAlign='center';x.fillText('Get ready… '+Math.max(1,Math.ceil((+show-now)/1000)),W/2,Hh*.35);c._state=null;return}
 if(state==='off'){x.fillStyle='rgba(11,22,25,.92)';x.fillRect(0,0,W,Hh);x.fillStyle='#b0bdba';x.font='italic 30px "IM Fell English", serif';x.textAlign='center';x.fillText('The tide has taken them back.',W/2,Hh/2);return}
 const r=mulberry(+c.dataset.seed),n=+c.dataset.count;
 for(let i=0;i<n;i++){const bx=20+r()*(W-60),by=20+r()*(Hh-60),s=22+r()*12,rot=(r()-.5)*.8;x.save();x.translate(bx+s/2,by+s/2);x.rotate(rot);x.fillStyle='#8a5a32';x.beginPath();x.ellipse(0,0,s*.42,s*.55,0,0,Math.PI*2);x.fill();x.strokeStyle='#3b2a20';x.lineWidth=3;x.beginPath();x.moveTo(-s*.42,-s*.22);x.lineTo(s*.42,-s*.22);x.moveTo(-s*.42,s*.22);x.lineTo(s*.42,s*.22);x.stroke();x.restore()}
}

/* ---------------- Events ---------------- */
document.addEventListener('input',e=>{
 const t=e.target;if(!t.id)return;
 if(t.id==='c-name'&&S.cdraft){S.cdraft.name=t.value;const h=document.querySelector('.card.lit h2');if(h)h.textContent=t.value||'Your name';return}
 if(t.id==='c-quip'&&S.cdraft){S.cdraft.quip=t.value;return}
 S.draft[t.id]=t.value;
});
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-peek]');if(el){el.classList.add('open');try{el.setPointerCapture(e.pointerId)}catch(_){}}});
['pointerup','pointercancel','pointerleave'].forEach(ev=>document.addEventListener(ev,e=>{const el=e.target.closest&&e.target.closest('[data-peek]');if(el)el.classList.remove('open')}));
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-peek]'))e.preventDefault()});
document.addEventListener('keydown',e=>{const el=e.target.closest&&e.target.closest('[data-peek]');if(el&&(e.key===' '||e.key==='Enter')){e.preventDefault();el.classList.add('open')}});
document.addEventListener('keyup',e=>{const el=e.target.closest&&e.target.closest('[data-peek]');if(el)el.classList.remove('open')});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
 const a=b.dataset.act,v=b.dataset.v,pid=b.dataset.pid;
 if(S.view==='game')wake();
 act(a,v,pid,b).catch(err=>console.warn(err));
});
async function act(a,v,pid,b){
 const g=S.game;
 switch(a){
  case 'toast-ok':if(S.toast&&S.toast.id){S.seenMsgs.push(S.toast.id);if(S.seenMsgs.length>60)S.seenMsgs=S.seenMsgs.slice(-60);LS.set('wc-seen',S.seenMsgs)}S.toast=null;checkMsgsAfter();render();return;
  case 'go-create':S.cdraft=null;S.prevView=S.view;S.view='create';S.scrollTop=true;window.scrollTo(0,0);render();return;
  case 'home':S.view=S.prevView==='game'&&S.game?'game':'home';S.prevView=null;render();return;
  case 'rand-look':S.cdraft.look={s:rint(5),h:rint(7),c:rint(8),x:rint(6)};render();return;
  case 'look':S.cdraft.look[b.dataset.k]=+v;render();return;
  case 'trade':S.cdraft.trade=+v;render();return;
  case 'save-profile':{const d=S.cdraft;d.name=(d.name||'').trim().slice(0,16);if(!d.name){S.toast={x:'Give your character a name first.'};render();return}S.profile=wireProfile(d);LS.set('wc-profile',S.profile);S.view=S.prevView==='game'&&S.game?'game':'home';if(S.pendingJoin){const c=S.pendingJoin;S.pendingJoin=null;return openGame(c)}if(H.g&&H.g.phase==='lobby'&&H.g.players[S.pid]){Object.assign(H.g.players[S.pid],sanitizeProf(S.profile));hostCommit()}else{S.lastPres=null;syncPresence()}render();return}
  case 'go-host':S.view='hostsetup';render();return;
  case 'hostplays':S.hostPlays=v==='1';render();return;
  case 'create-game':await createGame(S.hostPlays!==false);return;
  case 'join-code':{const c=(S.draft['join-code']||'').toUpperCase().replace(/[^A-Z]/g,'');if(c.length!==4){S.toast={x:'Game codes are four letters, like KDRT.'};render();return}S.draft['join-code']='';if(!S.profile){S.pendingJoin=c;S.cdraft=null;S.view='create';render();return}return openGame(c)}
  case 'share':{const url=joinLink(S.game.code);try{if(navigator.share){await navigator.share({title:'Wreckers of Porthcove',text:`Join my game of Wreckers of Porthcove (code ${S.game.code})`,url});return}}catch(e){if(e&&e.name==='AbortError')return}}
  // falls through to copy when sharing isn't available
  case 'copy':{const url=joinLink(S.game.code);try{await navigator.clipboard.writeText(url);S.toast={x:'Link copied. Paste it into your family chat.'}}catch(e){const el=document.getElementById('joinlink');if(el){const r=document.createRange();r.selectNodeContents(el);const sl=getSelection();sl.removeAllRanges();sl.addRange(r)}S.toast={x:'Press and hold the link to copy it.'}}render();return}
  case 'join':if(!S.profile){S.pendingJoin=b.dataset.code;S.cdraft=null;S.view='create';render();return}return openGame(b.dataset.code);
  case 'leave':leaveGame();return;
  case 'close-lost':LS.del('wc-host-'+S.code);LS.del('wc-last');leaveGame();return;
  case 'tab':S.tab=v;if(v==='log')S.newEv=false;S.scrollTop=true;window.scrollTo(0,0);render();return;
  case 'sound':S.sound=!S.sound;LS.set('wc-sound',S.sound);if(S.sound)chime('soft');render();return;
  case 'ready':return sendAct({ready:true});
  case 'night-w':S.draft.nw=pid;render();return;
  case 'night-t':S.draft.nt=pid;render();return;
  case 'night-send':{const sent=mine()||{};const w=S.draft.nw||sent.whisper,t=S.draft.nt||sent.target;return sendAct({whisper:w,target:t})}
  case 'offer':return sendAct({accept:v==='1'});
  case 'trivia':return sendAct({a:+v,t:Date.now()-(g.mission.t0||Date.now())});
  case 'lamp':{const seq=(S.draft.seq||[]).concat(+v);S.draft.seq=seq;if(seq.length>=g.mission.seq.length){return sendAct({seq,t:Date.now()-(g.mission.t0||Date.now())})}render();return}
  case 'lamp-clear':S.draft.seq=[];render();return;
  case 'cargo-send':{const n=parseInt(S.draft['cargo-n'],10);if(!isFinite(n)){S.toast={x:'Type a number of barrels first.'};render();return}return sendAct({n})}
  case 'boat':return sendAct({take:v==='1'});
  case 'vote-pick':S.draft.vote=pid;render();return;
  case 'vote-send':{const to=S.draft.vote||(mine()||{}).to;if(to)return sendAct({to});return}
  case 'll':return sendAct({end:v==='1'});
  case 'note-add':{const t=(S.draft['note-tx']||'').trim();if(!t)return;S.notes.push({id:'n'+rid(10),text:t.slice(0,240),at:Date.now(),tide:g?g.tide:0});S.draft['note-tx']='';saveNotes();render();return}
  case 'note-del':S.notes=S.notes.filter(n=>n.id!==b.dataset.id);saveNotes();render();return;
  case 'note-table':{const n=S.notes.find(n=>n.id===b.dataset.id);if(!n)return;if(H.g){if(!H.g.evidence.some(e=>e.id===n.id)){H.g.evidence.push({id:n.id,pid:S.pid,text:n.text,tide:H.g.tide,at:Date.now()});hostCommit()}return}S.pendingEv=S.pendingEv.filter(e=>e.id!==n.id).concat({id:n.id,text:n.text}).slice(-3);syncPresence();render();return}
  case 'log-copy':{const l=g.log[+b.dataset.i];if(!l)return;S.notes.push({id:'n'+rid(10),text:`Log, tide ${l.t}: ${l.x}`.slice(0,240),at:Date.now(),tide:g.tide});saveNotes();S.toast={x:'Copied to your notes.'};render();return}
  case 'reveal-items':S.revealItems=!S.revealItems;if(H.g){H.p.reveal[S.pid]=S.revealItems;hostCommit()}else{syncPresence();render()}return;
  case 'mvp':S.draft.mvp=S.draft.mvp===pid?null:pid;render();return;
  case 'judge':S.draft.out=v;render();return;
 }
 if(!H.g)return;
 const hg=H.g;
 switch(a){
  case 'set':{let val=v;if(b.dataset.k==='wreckers'||b.dataset.k==='councilMins')val=+v;if(v==='true')val=true;if(v==='false')val=false;hg.settings[b.dataset.k]=val;
   if(b.dataset.k==='hostPlays'){if(val&&!hg.players[S.pid]&&S.profile)addPlayer(S.pid,wireProfile(S.profile));if(!val&&hg.players[S.pid]){delete hg.players[S.pid];hg.order=hg.order.filter(p=>p!==S.pid)}}
   hostCommit();return}
  case 'add-bot':{if(hg.order.length>=16)return;const used=hg.order.map(p=>hg.players[p].name);const name=BOT_NAMES.find(n=>!used.includes(n))||('Bot '+(hg.order.length+1));addPlayer('bot-'+rid(8),{name,trade:rint(TRADES.length),look:{s:rint(5),h:rint(7),c:rint(8),x:rint(6)},quip:pick(BOT_QUIPS)},true);hostCommit();return}
  case 'kick':delete hg.players[pid];hg.order=hg.order.filter(p=>p!==pid);hostCommit();return;
  case 'h-start':startGame();return;
  case 'h-close':closeGame();return;
  case 'h-begin':startMission();return;
  case 'h-endnight':resolveNight();return;
  case 'h-pause':pauseToggle();return;
  case 'h-aftermorning':afterMorning();return;
  case 'h-mbegin':missionRound();return;
  case 'h-mswap':swapMission();return;
  case 'h-pstart':{const m=hg.mission;m.stage='play';hg.endsAt=Date.now()+PARLOUR[m.card].s*1000;hostCommit();return}
  case 'h-pstop':{hg.mission.stage='judge';hg.endsAt=null;hostCommit();return}
  case 'h-judge':judgeParlour(S.draft.out,S.draft.mvp);return;
  case 'h-council':toCouncil();return;
  case 'h-callvote':callVote();return;
  case 'h-addmin':hg.endsAt=(hg.endsAt||Date.now())+60000;if(hg.paused)hg.pausedLeft=(hg.pausedLeft||0)+60000;hostCommit();return;
  case 'h-closevote':closeVote();return;
  case 'h-skipreveal':{const vv=hg.vote;vv.shown=vv.reveal.length;computeResult();hostCommit();return}
  case 'h-afterreveal':afterReveal();return;
  case 'h-revealrole':revealBanished();return;
  case 'h-afterban':afterElimination();return;
  case 'h-afterll':afterLastLight();return;
  case 'h-again':hg.phase='lobby';startGame();return;
  case 'h-lobby':backToLobby();return;
 }
}
function checkMsgsAfter(){setTimeout(()=>{checkMsgs();if(S.toast)render()},300)}
function saveNotes(){if(S.code)LS.set('wc-notes-'+S.code,S.notes)}

boot();
</script>
